name: Purchase or download problem
description: You bought the game but it will not download, install or start.
title: "[Purchase] "
labels: ["purchase"]
body:
  - type: markdown
    attributes:
      value: |
        The game is paid for up front through the **LG Content Store**, which handles billing
        and refunds under its own process. All 50 levels are included, with no in-app purchases
        or unlock transactions; later levels are reached through gameplay progress. Contact
        LG Customer Support for store downloads, account or billing problems. We can help
        if the installed game itself will not start.

  - type: markdown
    attributes:
      value: |
        > **This issue is public.** Do not post your name, address, payment details,
        > LG account email or any order number here.
        > For private support, email badriandev@gmail.com. Check attachments for personal information.

  - type: checkboxes
    id: tried
    attributes:
      label: Please confirm you have tried these first
      options:
        - label: The TV is connected to the internet.
          required: true
        - label: The TV is signed in to the same LG account I used to buy the game.
          required: true
        - label: I checked the download or installation status in the LG Content Store.
          required: true

  - type: textarea
    id: what-happens
    attributes:
      label: What happens when you try to install or start it?
      description: Tell us what the game shows on screen.
      placeholder: The Content Store shows an error and the download never finishes.
    validations:
      required: true

  - type: input
    id: tv-model
    attributes:
      label: TV model
      description: "Settings \u2192 Support \u2192 TV Information"
      placeholder: OLED55C34LA
    validations:
      required: true

  - type: input
    id: game-version
    attributes:
      label: Game version
      description: "Shown on ABOUT & SUPPORT if the game starts; leave blank if unavailable."
      placeholder: 1.0.0
    validations:
      required: false

  - type: input
    id: country
    attributes:
      label: Country of purchase
      description: Which LG Content Store region did you buy from?
      placeholder: Germany
    validations:
      required: false

  - type: input
    id: when
    attributes:
      label: Roughly when did you buy it?
      description: A month is enough. Please do not post an order number.
      placeholder: October 2026
    validations:
      required: false
